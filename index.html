<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23264F">
<meta name="description" content="A cash flow game for founders. EIE Module M9, Finance for Startups. Centre for Innovation and Entrepreneurship, PES University.">
<title>Can You Keep the Lights On? | EIE M9</title>
<style>
:root {
  --navy: #23264F; --navy-deep: #14163A; --navy-mid: #2C2F6B;
  --orange: #E8740E; --orange-soft: #F2913D; --amber: #F4A23D;
  --paper: #FFFFFF; --paper-alt: #F7F5EF; --tint: #EEF0F8; --tint2: #E5E8F4;
  --ink: #23264F; --muted: #62668A; --line: #D8DBEC;
  --good: #1F8A5B; --good-soft: #E4F3EB; --bad: #C62828; --bad-soft: #FBEAEA; --warn-soft: #FDF1E4;
  --cash: #2A6FDB; --profit: #E8740E;
  --accent: var(--orange);
  --radius: 14px;
  --shadow: 0 1px 2px rgba(20, 22, 58, .06), 0 8px 24px rgba(20, 22, 58, .06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper-alt); color: var(--ink);
  font-family: Carlito, Calibri, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  font-size: 18px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  min-height: 100vh; display: flex; flex-direction: column;
}
body.dark { background: var(--navy-deep); }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wrap { width: 100%; max-width: 920px; margin: 0 auto; padding: 0 16px; }
main { flex: 1; position: relative; z-index: 1; padding: 20px 0 28px; }

#bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#bg svg { position: absolute; opacity: .07; animation: drift var(--d, 14s) ease-in-out infinite alternate; }
body.dark #bg svg { opacity: .13; }
@keyframes drift { from { transform: translateY(-10px) rotate(var(--r0, -8deg)); } to { transform: translateY(14px) rotate(var(--r1, 6deg)); } }

.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; }
.brandbar img { height: 34px; width: auto; display: block; }
.modlabel { font-size: 13px; font-weight: 700; letter-spacing: .2em; color: var(--navy); white-space: nowrap; }
.modlabel i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); vertical-align: middle; margin: 0 8px; }
body.dark .modlabel { color: #fff; }

.hud { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.hud .wrap { padding-top: 10px; padding-bottom: 10px; }
.hud-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.chip svg { width: 26px; height: 26px; flex: none; }
.months { display: flex; gap: 5px; margin-left: auto; }
.months b { width: 22px; height: 6px; border-radius: 3px; background: var(--tint2); }
.months b.done { background: var(--navy); }
.months b.now { background: var(--accent); }
.hud-sub { font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.bank { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; margin-top: 6px; }
.bank-label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bank-amt { font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.bank .bar { grid-column: 1 / -1; height: 12px; background: var(--tint2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; border-radius: 99px; transition: width .7s ease, background-color .7s; background: var(--good); }
.bank.mid .bar-fill { background: var(--amber); }
.bank.low .bar-fill { background: var(--bad); }
.bank.low .bank-amt, .bank.neg .bank-amt { color: var(--bad); }
.bank.neg .bar { outline: 2px solid var(--bad); background: var(--bad-soft); }
.runway { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; }
.bank.low .runway, .bank.neg .runway { color: var(--bad); }

.screen { animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font-size: 48px; line-height: 1.04; margin: 0 0 14px; letter-spacing: -.015em; }
h2 { font-size: 30px; line-height: 1.12; margin: 0 0 10px; letter-spacing: -.01em; }
h3 { font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
p { margin: 0 0 12px; }
.lead { font-size: 20px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 15px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card.rule { border-top: 4px solid var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; font-weight: 700; font-size: 19px; padding: 15px 24px; border-radius: 12px; background: var(--orange); color: #fff; box-shadow: 0 6px 18px rgba(232, 116, 14, .28); transition: transform .1s, background .2s, opacity .2s; }
@media (hover: hover) {
  .btn:hover { background: #d9680a; }
  .choice:hover { border-color: #b8bcdc; }
  .co:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(20, 22, 58, .12); }
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .35; cursor: not-allowed; box-shadow: none; }
.btn.navy { background: var(--navy); box-shadow: 0 6px 18px rgba(35, 38, 79, .25); }
.btn.ghost { background: var(--paper); color: var(--navy); border: 2px solid var(--line); box-shadow: none; }
.btn.danger { background: var(--bad); box-shadow: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.actions .btn { flex: 1 1 220px; }
.actions.center { justify-content: center; }

.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.choice { text-align: left; cursor: pointer; background: var(--paper); border: 2px solid var(--line); border-radius: var(--radius); padding: 13px 15px; transition: border-color .15s, background .15s, transform .1s; }
.choice:active { transform: scale(.99); }
.choice.sel { border-color: var(--accent); background: var(--warn-soft); box-shadow: 0 0 0 3px rgba(232, 116, 14, .15); }
.choice b { display: block; font-size: 21px; line-height: 1.15; margin-bottom: 2px; }
.choice span { display: block; font-size: 15px; color: var(--muted); }
.choice .why { color: var(--bad); font-weight: 700; }
.choice:disabled { opacity: .55; cursor: not-allowed; }
.q { font-size: 20px; font-weight: 700; margin: 22px 0 10px; }

.note { border-radius: 12px; padding: 13px 16px; margin: 12px 0; background: var(--tint); border-left: 5px solid var(--navy); }
.note.good { background: var(--good-soft); border-color: var(--good); }
.note.bad { background: var(--bad-soft); border-color: var(--bad); }
.note.warn { background: var(--warn-soft); border-color: var(--orange); }
.note.flush { margin: 0; }
.news { display: flex; gap: 12px; align-items: flex-start; }
.news svg { flex: none; width: 30px; height: 30px; margin-top: 1px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.panel h4 { margin: 0; font-size: 17px; }
.panel .sub { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.panel.pl { border-top: 4px solid var(--profit); }
.panel.cf { border-top: 4px solid var(--cash); }
.rows { width: 100%; border-collapse: collapse; font-size: 16px; }
.rows td { padding: 3px 0; vertical-align: top; }
.rows td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; font-variant-numeric: tabular-nums; }
.rows tr.total td { border-top: 2px solid var(--line); padding-top: 7px; font-weight: 700; font-size: 18px; }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.term { background: none; border: 0; padding: 0; cursor: help; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; border-bottom: 2px dotted var(--orange); }
#pop { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 160%); width: min(560px, calc(100% - 24px)); z-index: 50; background: var(--navy); color: #fff; border-radius: 16px; padding: 16px 44px 16px 18px; box-shadow: 0 16px 40px rgba(0, 0, 0, .3); transition: transform .25s ease; }
#pop { visibility: hidden; }
#pop.on { transform: translate(-50%, 0); visibility: visible; }
#pop b { color: var(--amber); display: block; font-size: 18px; margin-bottom: 2px; }
#pop button { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 0; cursor: pointer; }

.hero { color: #fff; padding: 24px 0 10px; }
.hero h1 { font-size: 66px; }
.hero h1 span { color: var(--orange); }
.hero .lead { color: #c9cbe6; max-width: 640px; }
.hero .eyebrow { color: var(--orange-soft); }
.pillrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
.pill { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 99px; background: rgba(255, 255, 255, .1); color: #fff; }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
.how div { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); border-radius: var(--radius); padding: 14px; color: #dfe1f3; font-size: 16px; }
.how b { display: block; color: #fff; font-size: 18px; margin-bottom: 2px; }
.cie-note { color: #9ea2c8; font-size: 14px; margin-top: 22px; }

.companies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.co { text-align: left; cursor: pointer; background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; transition: transform .15s, box-shadow .15s; }
.co .icon svg { width: 46px; height: 46px; }
.co h4 { margin: 0; font-size: 26px; }
.co .kind { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.co .shape { font-weight: 700; color: var(--c); }
.co .mini { width: 100%; height: 54px; }
.co .diff { font-size: 14px; color: var(--muted); }
.co .best { font-size: 14px; font-weight: 700; border-radius: 8px; padding: 5px 9px; background: var(--tint); margin-top: auto; }
.co .best.won { background: var(--good-soft); color: var(--good); }
.co .best.lost { background: var(--bad-soft); color: var(--bad); }

.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.fact { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.fact b { display: block; font-size: 22px; }
.fact span { font-size: 14px; color: var(--muted); }

.big-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
.big-stats.two { grid-template-columns: 1fr 1fr; }
.stat { border-radius: var(--radius); padding: 14px; background: var(--paper); border: 1px solid var(--line); text-align: center; }
.stat .l { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-size: 32px; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.stat.g { background: var(--good-soft); border-color: transparent; }
.stat.g .v { color: var(--good); }
.stat.r { background: var(--bad-soft); border-color: transparent; }
.stat.r .v { color: var(--bad); }

.over { text-align: center; padding-top: 10px; }
.over .title { font-size: 64px; font-weight: 700; color: var(--bad); letter-spacing: .03em; margin: 0; line-height: 1; }
.quote { font-size: 23px; font-weight: 700; line-height: 1.35; max-width: 720px; margin: 10px auto; }

.verdict { border-radius: 18px; padding: 24px; color: #fff; background: var(--navy); position: relative; overflow: hidden; }
.verdict.won { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%); }
.verdict.lost { background: linear-gradient(135deg, #3a1420 0%, var(--navy) 100%); }
.verdict h2 { color: #fff; font-size: 36px; }
.verdict p { color: #d4d6ee; margin: 0; }
.verdict .eyebrow { color: var(--orange-soft); }
.badge { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .2); border-radius: 99px; padding: 6px 14px 6px 6px; font-size: 16px; color: #fff; }
.badge b { background: var(--orange); border-radius: 99px; padding: 2px 10px; }
.coin-rain { position: fixed; top: -80px; z-index: 2; opacity: .55; pointer-events: none; animation: fall var(--t, 2.6s) ease-in forwards; }
@keyframes fall { to { transform: translateY(calc(100vh + 120px)) rotate(var(--spin, 360deg)); } }
.progress { display: inline-block; font-weight: 700; color: var(--navy); background: var(--tint); border-radius: 99px; padding: 5px 12px; font-size: 15px; margin-bottom: 14px; }
.verdict .ghost { position: absolute; right: -6px; bottom: -34px; font-size: 150px; font-weight: 700; color: rgba(255, 255, 255, .06); line-height: 1; }

.score { width: 100%; border-collapse: collapse; }
.score td { padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.score tr:last-child td { border-bottom: 0; }
.score td.k { font-weight: 700; width: 30%; padding-right: 10px; }
.score td.v { font-weight: 700; text-align: right; white-space: nowrap; width: 22%; padding-right: 16px; font-variant-numeric: tabular-nums; }
.score td.x { color: var(--muted); font-size: 16px; }
.score tr.key td { background: #fbfaf6; }

.bs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bs .panel h4 { display: flex; justify-content: space-between; gap: 10px; }
.bs .own { border-top: 4px solid var(--good); }
.bs .owe { border-top: 4px solid var(--bad); }
.equity { margin-top: 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.equity .big { font-size: 24px; font-weight: 700; }

.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.legend i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend .k-cash { background: var(--cash); }
.legend .k-profit { background: var(--profit); }
.chart text { font-family: inherit; }

.tree { overflow-x: auto; padding: 6px 2px 10px; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { position: relative; }
.node { display: inline-block; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 15px; width: 184px; }
.node b { display: block; font-size: 16px; line-height: 1.2; }
.node .w { color: var(--muted); font-size: 14px; display: block; line-height: 1.3; }
.node.root { background: var(--navy); color: #fff; border-color: var(--navy); width: 150px; }
.node.root .w { color: #c9cbe6; }
.node.mine { border: 2px solid var(--orange); box-shadow: 0 0 0 3px rgba(232, 116, 14, .15); }
.node .you { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .12em; background: var(--orange); color: #fff; border-radius: 5px; padding: 1px 6px; margin-bottom: 3px; }
.leaf { border-left: 5px solid var(--good); width: 206px; }
.leaf.dead { border-left-color: var(--bad); }
.leaf .res { font-weight: 700; display: block; }
.leaf.dead .res { color: var(--bad); }
.leaf:not(.dead) .res { color: var(--good); }
@media (min-width: 900px) {
  .tree > ul { display: inline-flex; }
  .tree li { display: flex; align-items: center; }
  .tree li > ul { display: flex; flex-direction: column; padding-left: 28px; position: relative; }
  .tree li > ul > li { padding: 5px 0; }
  .tree li > ul::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; border-top: 2px solid var(--line); }
  .tree li > ul > li::before { content: ""; position: absolute; left: -14px; width: 14px; top: 50%; border-top: 2px solid var(--line); }
  .tree li > ul > li::after { content: ""; position: absolute; left: -14px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
  .tree li > ul > li:first-child::after { top: 50%; }
  .tree li > ul > li:last-child::after { bottom: 50%; }
  .tree li > ul > li:only-child::after { display: none; }
  .tree li.on-path > ul::before, .tree li > ul > li.on-path::before { border-color: var(--orange); }
}
@media (max-width: 899px) {
  .tree li > ul { margin-left: 14px; padding-left: 14px; border-left: 2px solid var(--line); }
  .tree li > ul > li { padding-top: 8px; }
  .node, .leaf, .node.root { width: 100%; }
}

.path { list-style: none; padding: 0; margin: 0; }
.path li { position: relative; padding: 2px 0 12px 44px; min-height: 30px; }
.path li::before { content: "M" attr(data-m); position: absolute; left: 0; top: 0; width: 34px; height: 24px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.path li.m0::before { background: var(--muted); }

ul.learn { margin: 0; padding-left: 20px; }
ul.learn li { margin-bottom: 8px; }

.flyer { position: fixed; z-index: 30; font-weight: 700; font-size: 20px; pointer-events: none; animation: fly 1.4s ease-out forwards; }
.flyer.up { color: var(--good); }
.flyer.down { color: var(--bad); }
@keyframes fly { from { opacity: 0; transform: translateX(-8px); } 15% { opacity: 1; } to { opacity: 0; transform: translateX(30px); } }

footer { position: relative; z-index: 1; text-align: center; font-size: 14px; color: var(--muted); padding: 12px 16px calc(26px + env(safe-area-inset-bottom)); }
body.dark footer { color: #8f93bd; }

@media (max-width: 720px) {
  body { font-size: 17px; }
  h1 { font-size: 36px; }
  .hero h1 { font-size: 44px; }
  h2 { font-size: 25px; }
  .bank-amt { font-size: 25px; }
  .months b { width: 12px; }
  .brandbar img { height: 26px; }
  .modlabel { display: none; }
  .grid2, .companies, .how, .bs { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr 1fr; }
  .big-stats { grid-template-columns: 1fr 1fr; }
  .big-stats .stat:last-child:nth-child(3) { grid-column: 1 / -1; }
  .stat .v { font-size: 25px; }
  .over .title { font-size: 46px; }
  .quote { font-size: 19px; }
  .score tr { display: grid; grid-template-columns: 1fr auto; }
  .score td { border: 0; padding: 4px 0; width: auto !important; }
  .score td.v { padding-right: 0; }
  .score td.x { grid-column: 1 / -1; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .actions .btn { flex-basis: 100%; }
  .hud-sub { width: 100%; order: 3; }
}
@media (max-height: 500px) and (orientation: landscape) {
  .hud .wrap { padding-top: 6px; padding-bottom: 6px; }
  .bank { margin-top: 2px; }
  .bank-amt { font-size: 22px; }
  .bank .bar { height: 8px; }
  .hud { position: relative; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div class="hud" id="hud" hidden>
  <div class="wrap">
    <div class="hud-top">
      <div class="chip" id="hud-co"></div>
      <div class="months" id="hud-months"></div>
      <div class="hud-sub" id="hud-unit"></div>
    </div>
    <div class="bank" id="bank">
      <div class="bank-label">Bank balance</div>
      <div class="runway" id="hud-runway"></div>
      <div class="bank-amt" id="hud-cash" aria-live="polite"></div>
      <div></div>
      <div class="bar"><div class="bar-fill" id="hud-bar"></div></div>
    </div>
  </div>
</div>
<main class="wrap" id="app"></main>
<footer>EIE M9 - Finance for Startups | CIE, PES University</footer>
<div id="pop" role="dialog" aria-live="polite"><button type="button" data-close aria-label="Close"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M4 4l12 12M16 4L4 16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button><b></b><span></span></div>

<script>
const MONTHS = 6;
const NB = '\u00a0';

// Indian grouping: 1,20,00,000
function groupIN(n) {
  const s = String(Math.round(Math.abs(n)));
  if (s.length <= 3) return s;
  return s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + s.slice(-3);
}
const sign = n => (Math.round(n) < 0 ? '-' : '');
const inr = n => sign(n) + 'Rs' + NB + groupIN(n);
const trim = x => (x >= 100 ? String(Math.round(x)) : String(Math.round(x * 10) / 10));
function short(n) {
  const a = Math.abs(n);
  if (a >= 1e7) return sign(n) + 'Rs' + NB + trim(a / 1e7) + NB + 'Cr';
  if (a >= 1e5) return sign(n) + 'Rs' + NB + trim(a / 1e5) + NB + 'L';
  return inr(Math.round(n / 100) * 100);
}
const bare = n => short(n).replace('Rs' + NB, '');
const plus = n => (Math.round(n) > 0 ? '+' : '') + short(n);
const num = n => groupIN(n);
const cls = n => (n < -0.5 ? 'neg' : n > 0.5 ? 'pos' : '');
const sum = rows => rows.reduce((a, r) => a + r[r.length - 1], 0);
const pctTxt = x => Math.round(x) + '%';

const TERMS = {
  revenue: ['Revenue', 'Money customers agreed to pay for what you sold this period, whether or not it has reached your bank yet.'],
  cogs: ['COGS', 'Cost of goods sold: the direct cost of making the things you actually sold. Unsold stock isn\'t counted.'],
  gross: ['Gross profit', 'Revenue minus COGS. What each sale leaves you before rent, salaries and marketing.'],
  opex: ['Operating expenses', 'The cost of keeping the company running: rent, salaries, marketing.'],
  net: ['Net profit', 'What is left after every cost. This is the profit on your P&L, and it isn\'t the same as cash.'],
  pl: ['P&L', 'Profit and Loss statement, also called the income statement. It answers: are we making money?'],
  cashflow: ['Cash flow', 'Money actually moving in and out of your bank account. It answers: can we pay our bills?'],
  breakeven: ['Break-even', 'The point where your profits have paid back all your fixed costs. Before it, you\'re still paying for the start.'],
  burn: ['Burn rate', 'How much cash you lose each month when more goes out than comes in.'],
  runway: ['Runway', 'How many months until the cash runs out: cash in the bank divided by the monthly burn.'],
  receivable: ['Receivables', 'Money customers owe you for things already sold. It counts as revenue, but you can\'t spend it yet.'],
  payable: ['Payables', 'Money you owe suppliers for things you already received. It sits in your bank, but it isn\'t yours.'],
  inventory: ['Inventory', 'Products you paid to make but haven\'t sold. It\'s an asset, but it\'s cash stuck on a shelf.'],
  deferred: ['Customer advances', 'Money customers paid for things you haven\'t delivered yet. Accountants call it deferred revenue. You still owe them, so it\'s a liability.'],
  equity: ['Equity', 'What the company is worth to its owners: everything it owns minus everything it owes.'],
  dilution: ['Dilution', 'When you sell part of the company, your share shrinks. 100% of a small company can become 80% of a bigger one.'],
  valuation: ['Valuation', 'What an investor thinks the whole company is worth. Rs 40 L for 15% means they value it at about Rs 2.7 Cr.'],
  cac: ['CAC', 'Customer acquisition cost: marketing spend divided by the customers it brought in.'],
  ltv: ['LTV', 'Lifetime value: the profit one customer brings you before they leave.'],
  churn: ['Churn', 'The share of customers who leave every month.'],
  mrr: ['MRR', 'Monthly recurring revenue: what your subscribers pay you every month.'],
  capex: ['Capex', 'Money spent on things that last for years, like a kitchen or a van. It leaves your bank now but isn\'t a cost on this month\'s P&L.'],
  balance: ['Balance sheet', 'A snapshot of what the company owns (assets), what it owes (liabilities) and what is left for the owners (equity).'],
  loan: ['Loan', 'Borrowed money. You keep full ownership, but you pay interest and must repay it whatever happens.'],
  investor: ['Equity funding', 'Money from an investor in exchange for a share of the company. No repayments, but you own less forever.']
};
const T = (k, label) => `<button type="button" class="term" data-term="${k}">${label || TERMS[k][0]}</button>`;

const STUFONE = {
  id: 'stufone', name: 'Stufone', kind: 'Hardware', icon: 'phone', accent: '#E8740E',
  tagline: 'A tough, affordable phone built for students.',
  shape: 'Pay first, get paid later', difficulty: 'The classic trap',
  blurb: 'You pay the factory before a single phone sells, and a big retailer wants to pay you two months late.',
  mini: [-9, 3, -4, 3, 4, 5],
  startCash: 4000000,
  setup: [{ label: 'Phone design', amount: 500000 }, { label: 'Prototyping', amount: 300000 }],
  lowCash: 800000,
  cfg: {
    unitCost: { 250: 11000, 500: 10500, 1000: 10000 }, demand: { 11000: 200, 12000: 167, 15000: 110 },
    tag: { 11000: 'Cheap, sells fast.', 12000: 'The original plan.', 15000: 'Premium, sells slower.' },
    opex: 50000, upfront: .5, retailBoost: .5, retailDelay: 2, retailMonth: 2,
    viralMonth: 2, viral: 1.4, supplierMonth: 3, rise: 500

  story: () => `You and two friends designed <b>Stufone</b>, a tough, affordable phone for students. Friends and family put in <b>Rs 40 L</b>. The plan from your pitch deck: sell <b>1,000 phones in 6 months</b> at a 20% markup.`,
  facts: () => [[inr(10000), 'to make one phone in a batch of 1,000'], [inr(12000), 'planned selling price'], [inr(50000), 'rent, salaries, marketing per month']],
  init(s) { Object.assign(s, { price: null, retailer: null, lots: [], payable: 0, recv: {} }); },
  stock: s => s.lots.reduce((a, l) => a + l.q, 0),
  unitCost(b, m) { return b ? this.cfg.unitCost[b] + (m >= this.cfg.supplierMonth ? this.cfg.rise : 0) : 0; },
  demandFor(s, m, price = s.price) {
    const c = this.cfg, mult = m === c.viralMonth ? c.viral : 1, base = c.demand[price];
    return { direct: Math.round(base * mult), retail: s.retailer && m >= c.retailMonth ? Math.round(base * c.retailBoost * mult) : 0 };
  },
  hud(s) { return 'Phones in stock: ' + num(this.stock(s)); },
  events(s) {
    if (s.month !== this.cfg.retailMonth || s.retailer !== null) return [];
    return [{
      id: 'retailer', kicker: 'Big news', title: 'CampusMart wants to sell Stufone in its 80 stores',
      body: `<p>A big retail chain near colleges offers to stock your phone.</p><div class="grid2"><div class="note good flush"><b>The good:</b> you sell about <b>50% more phones</b> every month.</div><div class="note bad flush"><b>The catch:</b> they pay <b>60 days after</b> each sale. Money for a Month ${s.month} sale reaches you in Month ${s.month + 2}. Until then it's a ${T('receivable', 'receivable')}.</div></div>`,
      choices: [{ val: true, label: 'Accept the deal' }, { val: false, label: 'Decline, sell online only', ghost: true }],
      apply: (s, v) => { s.retailer = v; logStep(s, v ? 'Accepted CampusMart: 50% more sales, paid 60 days late' : 'Declined CampusMart'); }
    }];
  },
  banners(s) {
    const m = s.month, b = [];
    if (m === this.cfg.viralMonth) b.push(['good', 'A student\'s Instagram reel about Stufone went viral. Expect about <b>40% more buyers</b> this month.']);
    if (m === this.cfg.supplierMonth) b.push(['warn', 'Your chip supplier raised prices. Every phone now costs <b>Rs 500 more</b> to make.']);
    if (s.retailer && m > this.cfg.retailMonth) b.push(['', `CampusMart pays 60 days late.${s.recv[m] ? ' This month they pay you <b>' + short(s.recv[m]) + '</b> for earlier sales.' : ''}`]);
    return b;
  },
  decisions(s) {
    const m = s.month, d = [];
    if (m === 1) d.push({ key: 'price', q: 'Pick your price', options: [11000, 12000, 15000].map(p => ({ val: p, label: inr(p), sub: `About ${this.cfg.demand[p]} buyers a month. ${this.cfg.tag[p]}` })) });
    d.push({
      key: 'batch', q: 'How many phones should the factory make this month?',
      options: (m === 1 ? [250, 500, 1000] : [0, 250, 500, 1000]).map(b => ({
        val: b, label: b ? num(b) : 'None',

      }))
    });
    return d;
  },
  preview(s, p) {
    const price = s.month === 1 ? p.price : s.price;
    if (!price || p.batch === undefined) return `<div class="note">Factory terms: pay <b>half when you order</b> and half next month. Bigger batches are cheaper per phone.</div>`;
    const bill = p.batch * this.unitCost(p.batch, s.month), due = s.payable + bill / 2, d = this.demandFor(s, s.month, price);
    let be = '';
    if (s.month === 1) {
      const margin = price - this.unitCost(p.batch, 1), fixed = 800000 + this.cfg.opex * MONTHS;
      be = margin > 0
        ? `<br>${T('breakeven')}: each phone earns ${inr(margin)} over its making cost. To pay back ${short(fixed)} of fixed costs (design, prototype, 6 months of rent and salaries) you must sell about <b>${num(Math.ceil(fixed / margin))} phones</b>.`
        : `<br>${T('breakeven')}: at this price and batch size a phone sells for what it costs to make, so you can never break even.`;
    }
    return `<div class="note">Phones available: <b>${num(this.stock(s) + p.batch)}</b>. Expected buyers: <b>about ${num(d.direct + d.retail)}</b>.<br>Due to the factory this month: <b>${short(due)}</b>${p.batch ? `, and ${short(bill / 2)} more next month` : ''}.${be}</div>`;
  },
  take(s, qty) {
    let q = 0, cost = 0;
    while (qty > 0 && s.lots.length) {
      const lot = s.lots[0], n = Math.min(qty, lot.q);
      lot.q -= n; qty -= n; q += n; cost += n * lot.c;
      if (!lot.q) s.lots.shift();
    }
    return { q, cost };
  },
  step(s, p) {
    const c = this.cfg, m = s.month;
    if (m === 1) { s.price = p.price; s.flags.firstBatch = p.batch; logStep(s, `Priced at ${inr(p.price)}, first batch of ${num(p.batch)} phones`); }
    else logStep(s, p.batch ? `Made ${num(p.batch)} more phones` : 'Made no new phones');
    const unit = this.unitCost(p.batch, m), bill = p.batch * unit;
    const factory = s.payable + bill * c.upfront;
    s.payable = bill - bill * c.upfront;
    if (p.batch) s.lots.push({ q: p.batch, c: unit });
    const d = this.demandFor(s, m), sd = this.take(s, d.direct), sr = this.take(s, d.retail);
    const retailIn = s.recv[m] || 0;
    delete s.recv[m];
    if (sr.q) s.recv[m + c.retailDelay] = (s.recv[m + c.retailDelay] || 0) + sr.q * s.price;
    const sold = sd.q + sr.q, missed = d.direct + d.retail - sold;
    const why = [];
    if (factory > sd.cost + sr.cost) why.push(`You paid the factory for phones that are still sitting in the warehouse as ${T('inventory', 'inventory')}.`);
    if (sr.q) why.push(`CampusMart owes you for ${num(sr.q)} phones, but will only pay in Month ${m + c.retailDelay}.`);
    if (missed > 0) why.push(`You ran out of phones and missed <b>${num(missed)} sales</b>.`);
    return {
      head: `You sold ${num(sold)} phones${sr.q ? ` (${num(sr.q)} through CampusMart)` : ''}`,
      pl: [['rev', 'Revenue (phones sold x price)', sold * s.price], ['cogs', 'COGS (making cost of those phones)', -(sd.cost + sr.cost)], ['opex', 'Rent, salaries, marketing', -c.opex]],
      cash: [['Customers paid you', sd.q * s.price], ...(s.retailer ? [['CampusMart paid you', retailIn]] : []), ['Paid to the factory', -factory], ['Rent, salaries, marketing', -c.opex]],
      why
    };
  },
  offers() {
    return [
      { id: 'loan', kind: 'loan', amount: 3000000, rate: .02, title: 'Bank loan: Rs 30 L', text: 'The bank takes your phone stock as security. You keep 100% of Stufone but pay Rs 60,000 interest a month and must repay it all.' },
      { id: 'angel', kind: 'equity', amount: 5000000, stake: 20, title: 'Angel investor: Rs 50 L for 20%', text: 'No repayments ever, but the investor owns 20% of Stufone for good. That values Stufone at Rs 2.5 Cr.' }
    ];
  },
  balance(s) {
    return {
      assets: [['Cash in bank', s.cash], [`Phones in the warehouse (${T('inventory', 'inventory')})`, s.lots.reduce((a, l) => a + l.q * l.c, 0)], [`Owed by CampusMart (${T('receivable', 'receivables')})`, Object.values(s.recv).reduce((a, b) => a + b, 0)]],
      liabilities: [[`Still owed to the factory (${T('payable', 'payables')})`, s.payable], ['Bank loan', s.loan]]
    };
  },
  extra(s) {
    const margin = s.price - s.totals.cogs / Math.max(1, s.unitsSold);
    return [['Phones sold', num(s.unitsSold), `Out of ${num(s.unitsMade)} made. The plan was 1,000 in 6 months.`],
      [T('breakeven', 'Break-even point'), margin > 0 ? 'about ' + num(Math.round(1100000 / margin / 10) * 10) + ' phones' : 'never', margin > 0 ? 'Phones you must sell at your price and costs to pay back design, prototype and 6 months of running costs.' : 'Your price didn\'t cover the making cost.']];
  },
  overLine: s => (shownProfit(s)[1] > 0 ? CLASSIC : 'Your bank account is empty. Without cash you can\'t pay the factory, rent or salaries, so the company stops. \'Ran out of cash\' is the #2 reason startups fail.'),
  lessons: [
    '<b>Profit isn\'t cash.</b> Stufone can be profitable on paper and still go broke, because the factory is paid long before customers pay you.',
    '<b>The cheapest batch isn\'t the cheapest decision.</b> Rs 10,000 a phone looks smart, but it needs Rs 1 Cr before you sell anything.',
    '<b>Slow payers cost you cash, not profit.</b> CampusMart\'s sales count as revenue today, but the money arrives two months later.'
  ],
  tree: {
    root: 'Rs 32 L in the bank after design and prototyping',
    levels: [
      { title: 'the first batch', opts: [
        { val: 250, label: '250 phones', why: 'Rs 11,000 each. Only Rs 13.8 L due now.' },
        { val: 500, label: '500 phones', why: 'Rs 10,500 each. Rs 26 L due now.' },
        { val: 1000, label: '1,000 phones', why: 'Cheapest per phone, but Rs 50 L now and Rs 50 L next month.' }] },
      { title: 'the CampusMart deal', opts: [
        { val: true, label: 'Accept CampusMart', why: '50% more sales, paid 60 days late.' },
        { val: false, label: 'Decline CampusMart', why: 'Fewer sales, all paid on the spot.' }] }
    ],
    classify: s => [s.flags.firstBatch, s.retailer === true],
    policy(v1, v2) {
      return {
        event: (s, id) => (id === 'retailer' ? v2 : null),
        pick: s => (s.month === 1 ? { price: 12000, batch: v1 } : { batch: STUFONE.stock(s) < sumDemand(STUFONE.demandFor(s, s.month)) ? 250 : 0 })
      };
    },
    note: 'They all use a Rs 12,000 price, take no funding, and order 250 more phones whenever stock runs short.'

};
const sumDemand = d => d.direct + d.retail;
const CLASSIC = 'Your P&L says you made a profit. Your bank account says you\'re dead. This is why \'ran out of cash\' is the #2 reason startups fail.';

const CRAM = {
  id: 'cramcloud', name: 'CramCloud', kind: 'Subscription app', icon: 'cloud', accent: '#2A6FDB',
  tagline: 'Exam notes, flashcards and past papers for Rs 149 a month.',
  shape: 'Spend to grow, earn it back slowly', difficulty: 'Growth vs runway',
  blurb: 'Every new user costs marketing money today but pays you only Rs 149 a month. Grow fast and you burn fast.',
  mini: [-6, -6, -5, -3, -2, -1],
  startCash: 2500000,
  setup: [{ label: 'Building the app (freelance developers)', amount: 600000 }],
  lowCash: 500000,
  cfg: { price: 149, salaries: 250000, serverBase: 10000, serverPer: 10, fee: .03, churn: .1, organic: 150,
    cac: { 200000: 500, 500000: 600, 1000000: 800 }, yearly: 1200, yearlyShare: .4, shoutMonth: 4, shout: 600, crashMonth: 5, fix: 150000 },
  story: () => `You built <b>CramCloud</b>, an app with exam notes, flashcards and past papers. Students pay <b>Rs 149 a month</b>. You raised <b>Rs 25 L</b> from savings and family, and paid freelancers to build the first version.`,
  facts: () => [[inr(149), 'per student per month'], ['About 10%', `of subscribers quit every month (${T('churn', 'churn')})`], [inr(250000), 'salaries per month for your team of 3']],
  init(s) { Object.assign(s, { monthly: 0, yearly: [], yearlyOn: false, mktSpent: 0, mktUsers: 0, extraCost: 0, yearlyCashNow: 0 }); },
  users: s => s.monthly + s.yearly.reduce((a, y) => a + y.n, 0),
  deferred: s => Math.round(s.yearly.reduce((a, y) => a + y.n * CRAM.cfg.yearly * y.left / 12, 0)),
  mrr(s) { return s.monthly * this.cfg.price + Math.round(s.yearly.reduce((a, y) => a + (y.left > 0 ? y.n : 0), 0) * this.cfg.yearly / 12); },
  bought(mkt) { return mkt ? Math.round(mkt / this.cfg.cac[mkt]) : 0; },
  hud(s) { return 'Subscribers: ' + num(this.users(s)); },
  events(s) {
    const m = s.month, ev = [];
    if (m === 2) ev.push({
      id: 'early', kicker: 'Investor meeting', title: 'An angel investor likes your growth',
      body: `<p>She offers <b>Rs 40 L for 15% of CramCloud</b>. That's a ${T('valuation', 'valuation')} of about <b>Rs 2.7 Cr</b>.</p><div class="grid2"><div class="note good flush"><b>Take it:</b> months of extra ${T('runway', 'runway')} to grow.</div><div class="note bad flush"><b>The price:</b> you own 85% instead of 100%. That's ${T('dilution', 'dilution')}.</div></div><p class="small muted" style="margin-top:12px">Banks won't lend to CramCloud: an app with no profits has nothing they can take back if you fail.</p>`,
      choices: [{ val: true, label: 'Take Rs 40 L for 15%' }, { val: false, label: 'Not now, stay 100% ours', ghost: true }],
      apply: (s, v) => { if (v) { takeOffer(s, { id: 'early', kind: 'equity', amount: 4000000, stake: 15, title: 'Angel investor: Rs 40 L for 15%' }); s.flags.early = true; } else logStep(s, 'Turned down the early investor'); }
    });
    if (m === 3) ev.push({
      id: 'yearly', kicker: 'New idea', title: 'Offer a yearly plan?',
      body: `<p>Students could pay <b>Rs 1,200 for a whole year</b>, a third cheaper than monthly. About 40% of students would switch, and they would pay <b>today</b>.</p><div class="grid2"><div class="note good flush"><b>Cash now:</b> a big lump of money arrives this month.</div><div class="note bad flush"><b>The catch:</b> you now owe them 12 months of service. Only 1/12 counts as ${T('revenue', 'revenue')} each month. The rest is a ${T('deferred', 'customer advance')}.</div></div>`,
      choices: [{ val: true, label: 'Launch the yearly plan' }, { val: false, label: 'Keep monthly only', ghost: true }],
      apply: (s, v) => {
        s.yearlyOn = v; s.flags.yearly = v;
        if (v) { const k = Math.round(s.monthly * CRAM.cfg.yearlyShare); s.monthly -= k; s.yearly.push({ n: k, left: 12 }); s.yearlyCashNow += k * CRAM.cfg.yearly; }
        logStep(s, v ? 'Launched a yearly plan: cash upfront, service owed for 12 months' : 'Kept monthly plans only');
      }
    });
    if (m === this.cfg.crashMonth) ev.push({
      id: 'crash', kicker: 'Exam week emergency', title: 'Your servers crash the night before exams',
      body: `<p>Thousands of students can't open their notes. An emergency upgrade costs <b>Rs 1.5 L</b> this month. If you ride it out, about <b>1 in 4 monthly subscribers</b> will cancel.</p>`,
      choices: [{ val: true, label: 'Pay Rs 1.5 L to fix it' }, { val: false, label: 'Ride it out', ghost: true }],
      apply: (s, v) => { if (v) s.extraCost = CRAM.cfg.fix; else s.monthly = Math.round(s.monthly * .75); logStep(s, v ? 'Paid Rs 1.5 L to fix the servers' : 'Rode out the crash and lost a quarter of monthly subscribers'); }
    });
    return ev;
  },
  banners(s) {
    const b = [];
    if (s.month === this.cfg.shoutMonth) b.push(['good', 'A topper\'s YouTube video recommends CramCloud. About <b>600 extra students</b> join this month for free.']);
    if (s.month > 1) b.push(['', `About 10% of monthly subscribers leave every month (${T('churn', 'churn')}). Each new one bought with marketing costs Rs 500 to Rs 800 (${T('cac')}).`]);
    return b;
  },
  decisions() {
    return [{ key: 'mkt', q: 'How much will you spend on marketing this month?', options: [0, 200000, 500000, 1000000].map(v => ({ val: v, label: v ? short(v) : 'Nothing', sub: v ? `About ${num(this.bought(v))} new subscribers at ${inr(this.cfg.cac[v])} each.` : `Word of mouth only: about ${this.cfg.organic} a month.` })) }];
  },
  preview(s, p) {
    if (p.mkt === undefined) return '';
    const spend = this.cfg.salaries + p.mkt + (s.extraCost || 0);
    const expected = (Math.round(s.monthly * (s.month > 1 ? .9 : 1)) + this.cfg.organic + this.bought(p.mkt)) * this.cfg.price;
    return `<div class="note">Going out this month: salaries ${short(this.cfg.salaries)} + marketing ${short(p.mkt)}${s.extraCost ? ' + server fix ' + short(s.extraCost) : ''} = <b>${short(spend)}</b>. Monthly subscriptions will bring in about <b>${short(expected)}</b>.</div>`;
  },
  step(s, p) {
    const c = this.cfg, m = s.month;
    if (m > 1) s.monthly = Math.round(s.monthly * (1 - c.churn));
    const bought = this.bought(p.mkt);
    let fresh = c.organic + bought + (m === c.shoutMonth ? c.shout : 0);
    const newYearly = s.yearlyOn ? Math.round(fresh * c.yearlyShare) : 0;
    fresh -= newYearly;
    s.monthly += fresh;
    if (newYearly) s.yearly.push({ n: newYearly, left: 12 });
    const yearlyCash = s.yearlyCashNow + newYearly * c.yearly;
    s.yearlyCashNow = 0;
    let yearlyRev = 0;
    for (const y of s.yearly) if (y.left > 0) { yearlyRev += y.n * c.yearly / 12; y.left--; }
    yearlyRev = Math.round(yearlyRev);
    const monthlyRev = s.monthly * c.price, users = this.users(s);
    const running = Math.round(c.serverBase + c.serverPer * users + c.fee * (monthlyRev + yearlyCash));
    s.mktSpent += p.mkt; s.mktUsers += bought;
    logStep(s, `Marketing ${p.mkt ? short(p.mkt) : 'Rs 0'}: ${num(fresh + newYearly)} new subscribers`);
    const extra = s.extraCost;
    s.extraCost = 0;
    const why = [];
    if (yearlyCash > yearlyRev) why.push(`Yearly-plan students paid ${short(yearlyCash)} upfront, but only ${short(yearlyRev)} counts as revenue this month. You owe them the rest as service.`);

const COMPANIES = [STUFONE, CRAM, DABBA];
const byId = id => COMPANIES.find(c => c.id === id);

function newRun(co) {
  const s = { co: co.id, month: 0, cash: co.startCash, history: [], log: [], funding: [], own: 100, loan: 0, loanRate: 0, raised: 0,
    cumProfit: 0, totals: { rev: 0, cogs: 0, opex: 0, int: 0, setup: 0 }, used: {}, flags: {}, lost: false, lostMonth: null, last: null, queue: [], unitsSold: 0, unitsMade: 0 };
  co.init(s);
  for (const x of co.setup) {
    s.cash -= x.amount;
    if (x.capex) s.equipment += x.amount;
    else { s.totals.setup += x.amount; s.cumProfit -= x.amount; }
  }
  s.history.push({ m: 0, cash: s.cash, profit: s.cumProfit });
  s.log.push({ m: 0, text: co.setup.map(x => `${x.label}: ${short(x.amount)}`).join('. ') });
  return s;
}
function logStep(s, text) { s.log.push({ m: s.month, text }); }
function buyCapex(s, label, amount) { s.cash -= amount; s.equipment += amount; s.capexNow.push([label, amount]); }

function applyMonth(s, co, picks) {
  const stockBefore = co.stock ? co.stock(s) : 0, cashBefore = s.cash + (s.capexNow ? s.capexNow.reduce((a, x) => a + x[1], 0) : 0);
  const r = co.step(s, picks);
  const interest = Math.round(s.loan * s.loanRate);
  if (interest) { r.pl.push(['int', 'Loan interest', -interest]); r.cash.push(['Loan interest', -interest]); }
  r.pl = r.pl.map(x => [x[0], x[1], Math.round(x[2])]);
  r.cash = r.cash.map(x => [x[0], Math.round(x[1])]);
  const profit = sum(r.pl), change = sum(r.cash);
  for (const [k, , a] of r.pl) s.totals[k] += Math.abs(a);
  if (co.stock) { s.unitsMade += picks.batch || 0; s.unitsSold += stockBefore + (picks.batch || 0) - co.stock(s); }
  s.cash = cashBefore + change;
  s.cumProfit += profit;
  s.history.push({ m: s.month, cash: s.cash, profit: s.cumProfit });
  s.last = { ...r, profit, change, m: s.month };
}

function offersFor(s, co, crisis) {
  return co.offers(s).filter(o => !s.used[o.id]).map(o => ({ ...o, ok: !o.locked && (!crisis || s.cash + o.amount >= 0) }));
}
function takeOffer(s, o, crisis) {
  s.used[o.id] = true;
  s.cash += o.amount;
  if (o.kind === 'loan') { s.loan += o.amount; s.loanRate = o.rate; }
  else { s.own *= 1 - o.stake / 100; s.raised += o.amount; }
  s.funding.push({ m: s.month, label: (o.kind === 'loan' ? 'Loan +' : 'Investor +') + short(o.amount) });
  logStep(s, `Raised ${short(o.amount)} from ${o.title.replace(/:.*/, '').toLowerCase()}${crisis ? ' to survive' : ''}`);
  if (crisis) s.history[s.history.length - 1].cash = s.cash;
}
const canRaise = (s, co) => offersFor(s, co, false).some(o => o.ok);
const runwayMonths = s => (s.last && s.last.change < 0 ? s.cash / -s.last.change : Infinity);
const runwayText = s => (runwayMonths(s) < 1 ? 'less than a month' : `about ${Math.floor(runwayMonths(s))} month${Math.floor(runwayMonths(s)) === 1 ? '' : 's'}`);
const danger = (s, co) => s.cash < co.lowCash || runwayMonths(s) < 1.5;

function simulate(co, pol) {
  const s = newRun(co);
  while (s.month < MONTHS) {
    s.month++;
    for (const ev of co.events(s)) ev.apply(s, pol.event(s, ev.id));
    applyMonth(s, co, pol.pick(s));
    if (s.cash < 0) {
      const o = pol.crisis && offersFor(s, co, true).find(x => x.ok);
      if (o) takeOffer(s, o, true);
      else { s.lost = true; s.lostMonth = s.month; break; }
    }
  }
  return s;
}

const treeCache = {};
function treeOutcomes(co) {
  if (!treeCache[co.id]) {
    const out = {};
    for (const a of co.tree.levels[0].opts) for (const b of co.tree.levels[1].opts) out[a.val + '|' + b.val] = simulate(co, co.tree.policy(a.val, b.val));
    treeCache[co.id] = out;
  }
  return treeCache[co.id];
}
</script>

<script>

}

  const playing = S && !['title', 'hub'].includes(ui.screen);

  document.body.classList.toggle('dark', ui.screen === 'title');
  document.documentElement.style.setProperty('--accent', CO ? CO.accent : '#E8740E');
  if (!playing) return;
  document.getElementById('hud-co').innerHTML = ICON[CO.icon](CO.accent) + `<span>${CO.name}</span>`;
  const closed = S.last ? S.last.m : 0;
  document.getElementById('hud-months').innerHTML = Array.from({ length: MONTHS }, (_, i) => `<b class="${i + 1 <= closed ? 'done' : i + 1 === S.month ? 'now' : ''}"></b>`).join('');
  document.getElementById('hud-unit').textContent = `Month ${S.month} of ${MONTHS} | ${CO.hud(S)}`;
  document.getElementById('bank').className = 'bank ' + (S.cash < 0 ? 'neg low' : danger(S, CO) ? 'low' : S.cash < CO.startCash * .4 || runwayMonths(S) < 3 ? 'mid' : '');
  document.getElementById('hud-bar').style.width = (S.cash <= 0 ? 0 : Math.max(2, Math.min(100, S.cash / CO.startCash * 100))) + '%';
  const L = S.last;
  document.getElementById('hud-runway').innerHTML = S.cash < 0 ? 'Out of cash' : L && L.change < 0 ? `${T('runway', 'Runway')}: ${runwayText(S)}` : L ? 'Cash grew last month' : '';
  tweenCash(S.cash);
}

function tweenCash(to) {
  const el = document.getElementById('hud-cash'), from = shownCash === null ? to : shownCash;
  shownCash = to;
  if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = short(to); return; }
  const t0 = performance.now();
  const tick = t => {
    const k = Math.min(1, (t - t0) / 800);
    el.textContent = short(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'flyer ' + (to > from ? 'up' : 'down');
  f.textContent = plus(to - from);
  f.style.left = (r.right + 14) + 'px';
  f.style.top = (r.top + 2) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1500);
}

const screens = {};

screens.title = () => `

function insight(L) {
  const p = L.profit, c = L.change;
  let head, tone;
  if (p > 0 && c < 0) { head = `On paper you made ${short(p)}, but your bank balance fell by ${short(-c)}.`; tone = 'warn'; }
  else if (p < 0 && c > 0) { head = `Your P&L shows a loss of ${short(-p)}, yet your bank balance rose by ${short(c)}.`; tone = 'warn'; }
  else if (p >= 0 && c >= 0) { head = Math.abs(c - p) > 200000 ? `Profit ${plus(p)} and cash ${plus(c)}: same direction, very different sizes.` : 'Profit and cash both went up. A healthy month.'; tone = 'good'; }
  else { head = `You lost ${short(-p)} on paper and ${short(-c)} from the bank. That's your ${T('burn', 'burn')}.`; tone = 'bad'; }
  if (S.cash < 0) tone = 'bad';
  return `<div class="note ${tone}"><b>${head}</b> ${L.why.join(' ')}</div>`;
}

function chartSVG(H, funding) {
  const narrow = innerWidth < 640;
  const W = narrow ? 380 : 700, Ht = narrow ? 280 : 300, pl = narrow ? 46 : 64, pr = narrow ? 96 : 128, pt = 24, pb = 34;
  const vals = H.flatMap(h => [h.cash, h.profit]).concat(0);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = hi - lo || 1;
  lo -= span * .06; hi += span * .1;
  const raw = (hi - lo) / 5, p10 = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p10;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p10;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = m => pl + (W - pl - pr) * m / MONTHS, y = v => pt + (Ht - pt - pb) * (1 - (v - lo) / (hi - lo));
  let g = '';
  for (let v = lo; v <= hi + 1; v += step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1 ? '#9aa0bf' : '#E5E8F4'}" stroke-width="${Math.abs(v) < 1 ? 1.6 : 1}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="${narrow ? 13 : 12}" fill="#62668A">${bare(v)}</text>`;
  for (let m = 0; m <= MONTHS; m++) g += `<text x="${x(m)}" y="${Ht - 10}" text-anchor="middle" font-size="12" fill="#62668A">M${m}</text>`;
  const pts = k => H.map(h => `${x(h.m).toFixed(1)},${y(h[k]).toFixed(1)}`);
  const end = H[H.length - 1];
  let a = y(end.cash), b = y(end.profit);
  if (Math.abs(a - b) < 18) { const mid = (a + b) / 2, up = a <= b ? -1 : 1; a = mid + up * 9; b = mid - up * 9; }
  return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" width="100%" role="img" aria-label="Cash in bank versus total profit by month">${g}
    <polygon points="${pts('cash').join(' ')} ${pts('profit').reverse().join(' ')}" fill="rgba(232,116,14,.10)"/>
    <polyline points="${pts('profit').join(' ')}" fill="none" stroke="var(--profit)" stroke-width="3" stroke-dasharray="7 5"/>
    <polyline points="${pts('cash').join(' ')}" fill="none" stroke="var(--cash)" stroke-width="3.5"/>
    ${H.map(h => `<circle cx="${x(h.m)}" cy="${y(h.profit)}" r="4" fill="var(--profit)"/><circle cx="${x(h.m)}" cy="${y(h.cash)}" r="4.5" fill="var(--cash)"/>`).join('')}
    <text x="${x(end.m) + 10}" y="${a + 4}" font-size="13" font-weight="700" fill="var(--cash)">Cash ${bare(end.cash)}</text>
    <text x="${x(end.m) + 10}" y="${b + 4}" font-size="13" font-weight="700" fill="var(--profit)">Profit ${bare(end.profit)}</text>
    ${funding.map(fu => { const h = H.find(q => q.m === fu.m) || end; return `<text x="${x(fu.m)}" y="${y(h.cash) - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--good)">${fu.label}</text>`; }).join('')}
  </svg>`;
}

function badge(s) {
  if (s.lost) return s.cumProfit > 0 ? ['Paper Millionaire', 'profitable on paper, broke in the bank'] : ['Burnt Out', 'the cash ran out before the business worked'];
  if (s.own < 99.5) return ['Funded Founder', `survived with investor money, keeping ${pctTxt(s.own)}`];
  if (s.cumProfit > 0) return ['Cash Keeper', 'survived on your own money and made a profit'];
  return ['Survivor', 'kept the lights on without giving away any of the company'];
}

function coinShower() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#E8740E', '#F4A23D', '#1F8A5B'];
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('div');
    d.className = 'coin-rain';
    d.innerHTML = COIN_SVG(colors[i % 3]);
    d.style.cssText = `left:${(i * 37) % 100}%;width:${22 + (i * 7) % 20}px;animation-delay:${(i % 9) * .12}s;--t:${2.2 + (i % 5) * .3}s;--spin:${i % 2 ? 360 : -300}deg`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 4500);
  }
}

function treeHTML() {
  const t = CO.tree, out = treeOutcomes(CO), mine = t.classify(S);
  const leaf = (sim, on) => `<div class="node leaf ${sim.lost ? 'dead' : ''} ${on ? 'mine' : ''}">${on ? '<span class="you">YOUR PATH</span>' : ''}<span class="res">${sim.lost ? `Broke in Month ${sim.lostMonth}` : 'Survived 6 months'}</span><span class="w">Cash ${short(sim.cash)}<br>Profit ${plus(sim.cumProfit)}${sim.own < 99.5 ? `<br>You own ${pctTxt(sim.own)}` : ''}</span></div>`;
  const branch = (o, on, inner) => `<li class="${on ? 'on-path' : ''}"><div class="node ${on ? 'mine' : ''}"><b>${o.label}</b><span class="w">${o.why}</span></div><ul>${inner}</ul></li>`;
  return `<div class="tree"><ul><li class="on-path"><div class="node root"><b>Start</b><span class="w">${t.root}</span></div><ul>
    ${t.levels[0].opts.map(a => branch(a, a.val === mine[0], t.levels[1].opts.map(b => {
      const on = a.val === mine[0] && b.val === mine[1];
      return branch(b, on, `<li class="${on ? 'on-path' : ''}">${leaf(out[a.val + '|' + b.val], on)}</li>`);
    }).join(''))).join('')}
  </ul></li></ul></div>
  <p class="small muted" style="margin:10px 0 0">The tree splits on ${t.levels[0].title} and ${t.levels[1].title}, because those two choices matter most here. Each ending comes from actually playing the game that way. ${t.note} Your own result can be different if you raised money or made other choices along the way.</p>`;
}

function showTerm(k) {
  const pop = document.getElementById('pop');
  pop.querySelector('b').textContent = TERMS[k][0];
  pop.querySelector('span').textContent = TERMS[k][1];
  pop.classList.add('on');

document.addEventListener('click', e => {
  const term = e.target.closest('[data-term]');
  if (term) { showTerm(term.dataset.term); return; }
  if (!e.target.closest('#pop') || e.target.closest('[data-close]')) document.getElementById('pop').classList.remove('on');
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || performance.now() < lockUntil) return;
  const v = b.dataset.val;
  switch (b.dataset.act) {
    case 'hub': S = null; go('hub'); break;
    case 'pick': CO = byId(v); S = newRun(CO); shownCash = null; try { history.pushState({ game: 1 }, ''); } catch (e) { /* some file:// setups refuse */ } go('intro'); break;
    case 'again': S = newRun(CO); shownCash = null; go('intro'); break;
    case 'begin': startMonth(); break;
    case 'answer': { const ev = S.queue.shift(); ev.apply(S, ev.choices[+v].val); nextPrompt(); break; }
    case 'choose': ui.picks[b.dataset.key] = JSON.parse(v); render(); break;
    case 'run': applyMonth(S, CO, ui.picks); go('result'); break;
    case 'fund': {
      const crisis = ui.screen === 'crisis';
      takeOffer(S, offersFor(S, CO, crisis).find(o => o.id === v), crisis);
      if (!crisis) { S.flags['low' + S.month] = 1; nextPrompt(); }
      else if (S.month >= MONTHS) { go('report'); coinShower(); }
      else startMonth();
      break;
    }
    case 'nofund': S.flags['low' + S.month] = 1; go('decide'); break;
    case 'continue':
      if (S.cash < 0) go('crisis');
      else if (S.month >= MONTHS) { go('report'); coinShower(); }
      else startMonth();
      break;
    case 'shutdown': S.lost = true; S.lostMonth = S.month; go('gameover'); break;
    case 'report': go('report'); break;
  }
});
addEventListener('popstate', () => { if (S) { S = null; go('hub'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('pop').classList.remove('on'); });

let wasNarrow = innerWidth < 640;
addEventListener('resize', () => {
  if ((innerWidth < 640) !== wasNarrow && ui.screen === 'report') render();
  wasNarrow = innerWidth < 640;
});

function paintBackground() {
  const colors = ['#E8740E', '#1F8A5B', '#2A6FDB', '#F4A23D'];
  const spots = [[4, 10, 120, 0], [82, 6, 90, 1], [14, 62, 70, 2], [70, 48, 130, 0], [44, 84, 90, 3], [90, 80, 64, 1], [30, 30, 54, 2], [58, 18, 60, 3], [8, 88, 100, 1], [76, 70, 58, 0]];
  document.getElementById('bg').innerHTML = spots.map(([l, t, w, c], i) => (i % 2 ? COIN_SVG : NOTE_SVG)(colors[c])
    .replace('<svg', `<svg style="left:${l}%;top:${t}%;width:${w}px;--d:${11 + i * 1.7}s;--r0:${-10 + i * 3}deg;--r1:${6 - i * 2}deg"`)).join('');
}

function boot() {
  const css = document.createElement('style');
  css.textContent = `@font-face{font-family:Carlito;font-weight:400;font-display:swap;src:url(${ASSET.font400}) format('woff2')}@font-face{font-family:Carlito;font-weight:700;font-display:swap;src:url(${ASSET.font700}) format('woff2')}`;
  document.head.appendChild(css);
  paintBackground();
  render();
}
document.addEventListener('DOMContentLoaded', boot);
